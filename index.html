<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Board</title>
  <style>
    :root {
      --bg: #050a06;
      --sidebar-bg: #0a120c;
      --panel: #0d1a10;
      --panel-2: #132417;
      --line: #1c3822;
      --text: #dcffe4;
      --text-dim: #7ec28d;
      --text-faint: #3e734b;
      --amber: #f59e0b;
      --green: #10b981;
      --green-bright: #00ff66;
      --green-glow: 0 0 10px rgba(0, 255, 102, 0.4);
      --red: #ef4444;
      --blue: #38bdf8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    .app-shell {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* Vertical Sidebar Navigation */
    .sidebar {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--green-bright);
      text-shadow: var(--green-glow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-bright);
      box-shadow: var(--green-glow);
      display: inline-block;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: var(--panel);
      color: var(--green-bright);
      border-color: var(--line);
    }

    .tab-btn.active {
      background: var(--panel-2);
      color: var(--green-bright);
      border-color: var(--green-bright);
      box-shadow: var(--green-glow);
      font-weight: 600;
    }

    .tab-btn .idx {
      font-size: 11px;
      color: var(--text-faint);
      margin-right: 6px;
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .hdr-actions {
      padding: 12px 24px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .hdr-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .hdr-btn:hover {
      background: var(--panel-2);
      border-color: var(--green-bright);
      color: var(--green-bright);
    }

    .content-container { padding: 24px; flex: 1; }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--green-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input, select, button, textarea {
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--green-bright);
      box-shadow: var(--green-glow);
    }

    button {
      background: var(--panel-2);
      border-color: var(--green-bright);
      color: var(--green-bright);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--green-bright);
      color: var(--bg);
      box-shadow: var(--green-glow);
    }

    .event-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .event-tag {
      background: var(--panel);
      border: 1px solid var(--green-bright);
      color: var(--green-bright);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .cmdk-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding-top: 100px;
    }

    .cmdk-overlay.open { display: flex; }

    .cmdk-box {
      background: var(--sidebar-bg);
      border: 1px solid var(--green-bright);
      box-shadow: var(--green-glow);
      border-radius: 8px;
      width: 550px;
      padding: 12px;
    }

    .cmdk-input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--green-bright);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--green-bright);
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: -270px;
        transition: left 0.25s ease;
        box-shadow: 4px 0 20px rgba(0,255,102,0.15);
      }
      .sidebar.open { left: 0; }
      .mobile-menu-btn { display: block; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- VERTICAL SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="status-dot"></span>
        <span>CONTROL BOARD</span>
      </div>
    </div>
    <div class="sidebar-nav" id="tabbar">
      <button class="tab-btn active" data-tab="overview"><span class="idx">01</span> Overview</button>
      <button class="tab-btn" data-tab="calendar"><span class="idx">02</span> Calendar &amp; Schedule</button>
      <button class="tab-btn" data-tab="tasks"><span class="idx">03</span> Tasks</button>
      <button class="tab-btn" data-tab="habits"><span class="idx">04</span> Habits</button>
      <button class="tab-btn" data-tab="dump"><span class="idx">05</span> Brain Dump</button>
      <button class="tab-btn" data-tab="meds"><span class="idx">06</span> Meds</button>
      <button class="tab-btn" data-tab="vehicles"><span class="idx">07</span> Fleet</button>
      <button class="tab-btn" data-tab="fuel"><span class="idx">08</span> Fuel Log</button>
      <button class="tab-btn" data-tab="maint"><span class="idx">09</span> Fleet Maint</button>
      <button class="tab-btn" data-tab="c7maint"><span class="idx">10</span> Cat C7</button>
      <button class="tab-btn" data-tab="parts"><span class="idx">11</span> Parts</button>
      <button class="tab-btn" data-tab="loads"><span class="idx">12</span> Load Board</button>
      <button class="tab-btn" data-tab="finance"><span class="idx">13</span> Finance</button>
      <button class="tab-btn" data-tab="ifta"><span class="idx">14</span> IFTA</button>
      <button class="tab-btn" data-tab="reports"><span class="idx">15</span> Reports</button>
      <button class="tab-btn" data-tab="documents"><span class="idx">16</span> Docs</button>
      <button class="tab-btn" data-tab="contacts"><span class="idx">17</span> Contacts</button>
      <button class="tab-btn" data-tab="passwords"><span class="idx">18</span> Key Passwords</button>
      <button class="tab-btn" data-tab="jobcost"><span class="idx">19</span> Job Cost</button>
      <button class="tab-btn" data-tab="dot"><span class="idx">20</span> DOT / Compliance</button>
      <button class="tab-btn" data-tab="lift"><span class="idx">21</span> Lift Tracker</button>
      <button class="tab-btn" data-tab="projects"><span class="idx">22</span> Garage Projects</button>
      <button class="tab-btn" data-tab="mcmaint"><span class="idx">23</span> Moto Maint</button>
      <button class="tab-btn" data-tab="vethospital"><span class="idx">24</span> Vet Hospital</button>
      <button class="tab-btn" data-tab="shopping"><span class="idx">25</span> Shared List</button>
      <button class="tab-btn" data-tab="woodworking"><span class="idx">26</span> Wood Design</button>
      <button class="tab-btn" data-tab="bookmarks"><span class="idx">27</span> Bookmarks</button>
    </div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <div class="main-wrapper">
    <div class="hdr-actions">
      <button class="mobile-menu-btn" id="sidebarToggleBtn">☰</button>
      <div id="todayLabel" style="margin-right:auto; font-weight:600; font-size:13px; color:var(--green-bright);">---</div>
      <button class="hdr-btn" id="globalSearchBtn">🔍 Global Search <span style="color:var(--text-faint);">Ctrl+Shift+F</span></button>
      <button class="hdr-btn" id="cmdkBtn">⌘ Jump <span style="color:var(--text-faint);">Ctrl+K</span></button>
    </div>

    <div class="content-container">
      <!-- 01 OVERVIEW -->
      <div class="tab-pane active" id="pane-overview">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">System Status</div>
          </div>
          <div id="ovDueList">Green terminal active. Storage sync operational.</div>
        </div>
      </div>

      <!-- 02 CALENDAR & SCHEDULE -->
      <div class="tab-pane" id="pane-calendar">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Master Schedule &amp; Calendar Events</div>
          </div>
          <div class="add-row">
            <input type="text" id="calEventTitle" placeholder="Add custom event..." style="flex:1;">
            <input type="date" id="calEventDate">
            <button id="addCalEventBtn">Add Event</button>
          </div>
          <div id="calendarEventsList" style="margin-top:12px;"></div>
        </div>
      </div>

      <!-- 03 TASKS -->
      <div class="tab-pane" id="pane-tasks">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">Tasks &amp; Action Items</div>
          </div>
          <div class="add-row">
            <input type="text" id="taskInput" placeholder="Add a new task..." style="flex:1;">
            <button id="addTaskBtn">Add Task</button>
          </div>
          <div id="taskList"></div>
        </div>
      </div>

      <!-- 20 DOT / COMPLIANCE -->
      <div class="tab-pane" id="pane-dot">
        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">DOT Compliance &amp; Expiring Items</div>
          </div>
          <div class="add-row">
            <input type="text" id="dotTitle" placeholder="Item Name (e.g. Annual Inspection)" style="flex:1;">
            <input type="date" id="dotDueDate">
            <button id="dotAddBtn">Log Item</button>
          </div>
          <div id="dotList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Drawer Toggle & Tab Switching Logic
  const sidebar = document.getElementById('sidebar');
  const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
  if(sidebarToggleBtn) sidebarToggleBtn.onclick = () => sidebar.classList.toggle('open');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const pane = document.getElementById('pane-' + btn.dataset.tab);
      if(pane) pane.classList.add('active');
      if(btn.dataset.tab === 'calendar') renderCalendar();
      if(window.innerWidth <= 860) sidebar.classList.remove('open');
    });
  });

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  // Persistent Storage and Calendar Rendering Engine
  let localEvents = JSON.parse(localStorage.getItem('cb_events') || '[]');
  let dotItems = JSON.parse(localStorage.getItem('cb_dot') || '[]');

  document.getElementById('addCalEventBtn').onclick = () => {
    const title = document.getElementById('calEventTitle').value;
    const date = document.getElementById('calEventDate').value;
    if(!title || !date) return;
    localEvents.push({ title, date, cat: 'General' });
    localStorage.setItem('cb_events', JSON.stringify(localEvents));
    document.getElementById('calEventTitle').value = '';
    document.getElementById('calEventDate').value = '';
    renderCalendar();
  };

  document.getElementById('dotAddBtn').onclick = () => {
    const title = document.getElementById('dotTitle').value;
    const date = document.getElementById('dotDueDate').value;
    if(!title || !date) return;
    dotItems.push({ title, date });
    localStorage.setItem('cb_dot', JSON.stringify(dotItems));
    document.getElementById('dotTitle').value = '';
    document.getElementById('dotDueDate').value = '';
    renderDOT();
    renderCalendar();
  };

  function renderCalendar() {
    const container = document.getElementById('calendarEventsList');
    container.innerHTML = '';
    
    // Aggregate custom calendar events + DOT compliance dates
    const all = [
      ...localEvents.map(e => ({ ...e, cat: e.cat || 'Event' })),
      ...dotItems.map(d => ({ title: d.title, date: d.date, cat: 'DOT Deadline' }))
    ];

    all.sort((a,b) => (a.date || '').localeCompare(b.date || ''));

    if(!all.length) {
      container.innerHTML = '<div style="color:var(--text-faint); font-style:italic;">No calendar events or scheduled deadlines found. Use the form above to add an event.</div>';
      return;
    }

    all.forEach(e => {
      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `
        <div>
          <strong style="color:var(--green-bright);">${e.date}</strong> — 
          <span>${e.title}</span>
        </div>
        <span class="event-tag">${e.cat}</span>
      `;
      container.appendChild(row);
    });
  }

  function renderDOT() {
    const list = document.getElementById('dotList');
    if(!list) return;
    list.innerHTML = '';
    dotItems.forEach(d => {
      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `<span>${d.title}</span><strong style="color:var(--green-bright);">${d.date}</strong>`;
      list.appendChild(row);
    });
  }

  // Initial Render on Page Load
  renderCalendar();
  renderDOT();
</script>
</body>
</html>
