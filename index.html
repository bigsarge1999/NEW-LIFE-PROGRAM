<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Sarge Transportation - Dispatch & Fuel Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2e7d32;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 2px solid var(--accent-green);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 1.8rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-green);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Big Sarge Transportation Log</h1>
    </header>

    <div class="card">
        <h2>Add Entry</h2>
        <form id="logForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="odometer">Odometer Reading</label>
                <input type="number" id="odometer" placeholder="e.g. 185000" required>
            </div>
            <div class="form-group">
                <label for="gallons">Gallons Pumped</label>
                <input type="number" step="0.01" id="gallons" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="cost">Total Cost ($)</label>
                <input type="number" step="0.01" id="cost" placeholder="0.00" required>
            </div>
            <button type="submit">Save Entry</button>
        </form>
    </div>

    <div class="card">
        <h2>Log History</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Odometer</th>
                    <th>Gallons</th>
                    <th>Cost</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
                <!-- Dynamic rows inserted here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const logForm = document.getElementById('logForm');
    const logTableBody = document.getElementById('logTableBody');

    // LocalStorage retrieval
    let logs = JSON.parse(localStorage.getItem('bst_logs')) || [];

    function renderLogs() {
        logTableBody.innerHTML = '';
        logs.forEach(entry => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${entry.date}</td>
                <td>${entry.odometer}</td>
                <td>${entry.gallons}</td>
                <td>$${entry.cost}</td>
            `;
            logTableBody.appendChild(row);
        });
    }

    logForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const entry = {
            date: document.getElementById('date').value,
            odometer: document.getElementById('odometer').value,
            gallons: document.getElementById('gallons').value,
            cost: document.getElementById('cost').value
        };

        logs.push(entry);
        localStorage.setItem('bst_logs', JSON.stringify(logs));
        renderLogs();
        logForm.reset();
    });

    renderLogs();
</script>

</body>
</html>
