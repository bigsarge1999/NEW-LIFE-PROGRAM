<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Board</title>
  <style>
    :root {
      --bg: #050a06;
      --sidebar-bg: #0a120c;
      --panel: #0d1a10;
      --panel-2: #132417;
      --line: #1c3822;
      --text: #dcffe4;
      --text-dim: #7ec28d;
      --text-faint: #3e734b;
      --green-bright: #00ff66;
      --green-glow: 0 0 10px rgba(0, 255, 102, 0.4);
      --red: #ef4444;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    .app-shell {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--green-bright);
      text-shadow: var(--green-glow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-bright);
      box-shadow: var(--green-glow);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 9px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .tab-btn:hover {
      background: var(--panel);
      color: var(--green-bright);
    }

    .tab-btn.active {
      background: var(--panel-2);
      color: var(--green-bright);
      border-color: var(--green-bright);
      box-shadow: var(--green-glow);
      font-weight: 600;
    }

    .tab-btn .idx {
      font-size: 11px;
      color: var(--text-faint);
      margin-right: 8px;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .hdr-actions {
      padding: 12px 24px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .content-container { padding: 24px; flex: 1; }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--green-bright);
      margin-bottom: 12px;
    }

    iframe {
      width: 100%;
      height: 750px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #000;
    }

    .file-config-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input, button {
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    button {
      border-color: var(--green-bright);
      color: var(--green-bright);
      cursor: pointer;
    }

    button:hover {
      background: var(--green-bright);
      color: var(--bg);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="status-dot"></span>
        <span>CONTROL BOARD</span>
      </div>
    </div>
    <div class="sidebar-nav">
      <button class="tab-btn active" data-tab="overview"><span class="idx">01</span> Overview</button>
      <button class="tab-btn" data-tab="calendar"><span class="idx">02</span> Calendar &amp; Schedule</button>
      <button class="tab-btn" data-tab="tasks"><span class="idx">03</span> Tasks</button>
      <button class="tab-btn" data-tab="dot"><span class="idx">20</span> DOT / Compliance</button>
      <button class="tab-btn" data-tab="vethospital"><span class="idx">24</span> Vet Hospital</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <div class="hdr-actions">
      <div id="todayLabel" style="margin-right:auto; font-weight:600; font-size:13px; color:var(--green-bright);"></div>
    </div>

    <div class="content-container">
      <div class="tab-pane active" id="pane-overview">
        <div class="panel">
          <div class="panel-title">System Status</div>
          <p>Select Tab 02 to view your external Calendar module.</p>
        </div>
      </div>

      <!-- 02 CALENDAR TAB WITH IFRAME EMBED -->
      <div class="tab-pane" id="pane-calendar">
        <div class="panel">
          <div class="panel-title">Master Calendar &amp; Schedule</div>
          
          <div class="file-config-box">
            <input type="text" id="calendarFilePath" value="calendar.html" placeholder="Path to your calendar file..." style="flex:1;">
            <button id="loadCalendarBtn">Load External File</button>
          </div>

          <!-- Embedded Separate Calendar File -->
          <iframe id="calendarFrame" src="calendar.html"></iframe>
        </div>
      </div>

      <div class="tab-pane" id="pane-tasks">
        <div class="panel"><div class="panel-title">Tasks</div></div>
      </div>
      <div class="tab-pane" id="pane-dot">
        <div class="panel"><div class="panel-title">DOT Compliance</div></div>
      </div>
      <div class="tab-pane" id="pane-vethospital">
        <div class="panel"><div class="panel-title">Vet Hospital</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Tab Switching Logic
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const pane = document.getElementById('pane-' + btn.dataset.tab);
      if(pane) pane.classList.add('active');
    });
  });

  // Dynamic Iframe File Loader
  const frame = document.getElementById('calendarFrame');
  const pathInput = document.getElementById('calendarFilePath');
  const loadBtn = document.getElementById('loadCalendarBtn');

  loadBtn.onclick = () => {
    if (pathInput.value) {
      frame.src = pathInput.value;
    }
  };

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
</script>
</body>
</html>
