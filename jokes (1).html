<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joke Vault</title><style>
:root{--bg:#070b13;--side:#0a1220;--panel:#101b2d;--panel2:#15243a;--line:#273d5d;--txt:#edf5ff;--muted:#91a7c4;--accent:#f2b23c;--blue:#62aefa;--red:#ff6c7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:linear-gradient(180deg,#091322,#080e18);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:20px}
.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:11px}
.nav-label{font-size:10px;font-weight:800;letter-spacing:.12em;color:#7188a6;padding:0 9px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button,.side-action{border:1px solid transparent;border-radius:9px;background:transparent;color:#b9cbe2;text-align:left;padding:10px 11px;font:inherit;cursor:pointer}
.nav button:hover,.nav button.active{background:#182b46;color:#fff;border-color:#2c4b70}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}
.side-note{padding:0 8px;color:var(--muted);font-size:11px}
.main{min-width:0;padding:28px 32px 40px}
.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}
.topbar h1{margin:0;font-size:25px}.topbar p{margin:3px 0 0;color:var(--muted)}
.buttons{display:flex;gap:9px}
.btn{border:1px solid #365575;border-radius:9px;background:#18304d;color:#eaf4ff;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#231702}
.toolbar,.stat,.card{border:1px solid var(--line);background:var(--panel);border-radius:13px}
.toolbar{display:flex;gap:10px;padding:12px;margin-bottom:17px;flex-wrap:wrap}
.search{flex:1;min-width:180px}
input,select,textarea{width:100%;background:#081323;border:1px solid #2b4668;border-radius:8px;color:var(--txt);padding:9px 10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #62aefa20}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.stat{padding:14px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;margin-top:3px;font-size:27px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{overflow:hidden;padding:15px;display:flex;flex-direction:column;gap:8px}
.card .cat{display:inline-block;align-self:flex-start;font-size:10px;padding:3px 8px;border-radius:12px;border:1px solid #315275;background:#142b46;color:#c2d8f0}
.card .setup{font-size:14px;font-weight:600}
.card .punch{color:var(--muted);font-size:13px}
.card .actions{display:flex;gap:7px;margin-top:auto;padding-top:6px}
.card .actions button{padding:6px 8px;border-radius:7px;border:1px solid #365575;background:#19324f;color:#eaf4ff;font-size:12px;cursor:pointer}
.card .actions .del{background:#3c1d2a;border-color:#7c3347}
.card .fav{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0}
.card .fav.on{color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;border:1px dashed #345474;border-radius:13px;padding:50px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:10;padding:16px;background:#020713c4;place-items:center}
.modal.open{display:grid}
.dialog{width:min(620px,100%);max-height:92vh;overflow:auto;background:#101e33;border:1px solid #385a7c;border-radius:15px;padding:20px;box-shadow:0 22px 60px #0009}
.dialog h2{margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11px;color:#bcd1e8}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">🎤</div><div><b>Joke Vault</b><small>Dad jokes & more</small></div></div><div><div class="nav-label">BROWSE</div><nav class="nav" id="catNav"><button class="active" data-cat="all">☰ &nbsp; All jokes</button><button data-cat="favorite">★ &nbsp; Favorites</button></nav></div><div class="side-bottom"><p class="side-note">Local-first joke box<br>Add a joke, pick a category, and hit "Tell me one" for a random pick.</p></div></aside><main class="main"><header class="topbar"><div><h1>Joke Vault</h1><p>Keep your favorite one-liners and dad jokes on tap.</p></div><div class="buttons"><button class="btn" id="random">🎲 Tell me one</button><button class="btn primary" id="add">+ Add joke</button></div></header><section class="toolbar"><input class="search" id="search" placeholder="Search jokes or categories"><select id="sort"><option value="new">Newest added</option><option value="old">Oldest added</option><option value="category">Category A–Z</option></select></section><section class="stats"><div class="stat"><span>Total jokes</span><strong id="total">0</strong></div><div class="stat"><span>Categories used</span><strong id="cats">0</strong></div><div class="stat"><span>Favorites</span><strong id="favs">0</strong></div><div class="stat"><span>Told today</span><strong id="told">0</strong></div></section><section class="grid" id="grid"></section></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="dialogTitle">Add joke</h2><form id="form"><input type="hidden" id="editId"><div class="field"><label>CATEGORY</label><select id="category"><option>Dad Jokes</option><option>Puns</option><option>Knock-Knock</option><option>One-Liners</option><option>Work &amp; Job Jokes</option><option>Trucking / CB Jokes</option><option>Animal Jokes</option><option>Kids Jokes</option><option>Tech / Programming</option><option>Riddles</option><option>Other</option></select></div><div class="field"><label>SETUP</label><textarea id="setup" required placeholder="Why did the truck driver..."></textarea></div><div class="field"><label>PUNCHLINE</label><textarea id="punch" placeholder="...(leave blank for a one-liner with no separate punchline)"></textarea></div><label class="field" style="flex-direction:row;align-items:center;gap:8px"><input id="favorite" type="checkbox" style="width:auto"> Favorite</label><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save joke</button></div></form></div></div><script>
const K='jokevault-v1',$=id=>document.getElementById(id);
let jokes=JSON.parse(localStorage.getItem(K)||'[]'),filter='all',toldCount=0;
const CATS=['Dad Jokes','Puns','Knock-Knock','One-Liners','Work & Job Jokes','Trucking / CB Jokes','Animal Jokes','Kids Jokes','Tech / Programming','Riddles','Other'];
function save(){localStorage.setItem(K,JSON.stringify(jokes));render()}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newid(){let d=new Date;return 'JK-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function rebuildCatNav(){
  let nav=$('catNav');
  let used=[...new Set(jokes.map(j=>j.category))].sort();
  nav.innerHTML='<button class="'+(filter==='all'?'active':'')+'" data-cat="all">☰ &nbsp; All jokes</button><button class="'+(filter==='favorite'?'active':'')+'" data-cat="favorite">★ &nbsp; Favorites</button>'+
    used.map(c=>`<button class="${filter===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});
}
function visible(){
  let q=$('search').value.toLowerCase();
  let a=jokes.filter(j=>(filter==='all'||(filter==='favorite'&&j.favorite)||j.category===filter)&&(!q||Object.values(j).join(' ').toLowerCase().includes(q)));
  let s=$('sort').value;
  return a.sort((a,b)=>s==='new'?b.created-a.created:s==='old'?a.created-b.created:a.category.localeCompare(b.category)||b.created-a.created);
}
function render(){
  rebuildCatNav();
  let a=visible();
  $('total').textContent=jokes.length;
  $('cats').textContent=new Set(jokes.map(j=>j.category)).size;
  $('favs').textContent=jokes.filter(j=>j.favorite).length;
  $('told').textContent=toldCount;
  $('grid').innerHTML=a.length?a.map(j=>`<article class="card"><span class="cat">${esc(j.category)}</span><div class="setup">${esc(j.setup)}</div>${j.punch?`<div class="punch">${esc(j.punch)}</div>`:''}<div class="actions"><button onclick="editJoke('${j.id}')">Edit</button><button class="fav ${j.favorite?'on':''}" onclick="toggleFav('${j.id}')">★</button><button class="del" onclick="delJoke('${j.id}')">Delete</button></div></article>`).join(''):
    '<div class="empty"><h3>No jokes in this view</h3><p>Add one manually or pick a different category.</p></div>';
}
function open_(j){
  $('form').reset();
  $('dialogTitle').textContent=j?'Edit joke':'Add joke';
  $('editId').value=j?.id||'';
  $('category').value=j?.category||'Dad Jokes';
  $('setup').value=j?.setup||'';
  $('punch').value=j?.punch||'';
  $('favorite').checked=!!j?.favorite;
  $('modal').classList.add('open');
}
function close_(){$('modal').classList.remove('open')}
$('add').onclick=()=>open_();
$('cancel').onclick=close_;
$('modal').onclick=e=>{if(e.target===$('modal'))close_()};
$('form').onsubmit=e=>{
  e.preventDefault();
  let old=jokes.find(j=>j.id===$('editId').value);
  let j={id:old?.id||newid(),created:old?.created||Date.now(),category:$('category').value,setup:$('setup').value.trim(),punch:$('punch').value.trim(),favorite:$('favorite').checked};
  jokes=old?jokes.map(x=>x.id===j.id?j:x):[...jokes,j];
  save();close_();
};
window.editJoke=id=>open_(jokes.find(j=>j.id===id));
window.delJoke=id=>{if(confirm('Delete this joke?')){jokes=jokes.filter(j=>j.id!==id);save()}};
window.toggleFav=id=>{let j=jokes.find(j=>j.id===id);if(j){j.favorite=!j.favorite;save()}};
$('random').onclick=()=>{
  let pool=visible();
  if(!pool.length){alert('No jokes to tell in this view yet — add one first!');return}
  let j=pool[Math.floor(Math.random()*pool.length)];
  toldCount++;
  alert(j.setup+(j.punch?'\n\n'+j.punch:''));
  render();
};
$('search').oninput=render;
$('sort').onchange=render;
render();
</script></body></html>
