<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW LIFE PROGRAM</title>
    <style>
        :root {
            --bg-main: #121413;
            --bg-panel: #1b1e1b;
            --bg-card: #242924;
            --accent-green: #2e5a36;
            --accent-hover: #3b7346;
            --text-light: #e1e4e1;
            --text-dim: #8c948c;
            --border-color: #2e352e;
            --gold: #c5a059;
            --danger: #a33b3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding: 20px;
        }

        .app-container {
            max-width: 950px;
            margin: 0 auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        header {
            border-bottom: 2px solid var(--accent-green);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 768px) {
            .main-grid {
                grid-template-columns: 340px 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--gold);
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .appointment-item {
            background-color: var(--bg-main);
            border-left: 4px solid var(--accent-green);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .appt-info h3 {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .appt-info p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .appt-date {
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 20px 0;
            font-style: italic;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>NEW LIFE PROGRAM</h1>
            <button class="btn" style="width: auto;" id="openModalBtn">Open Quick Selection</button>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2>Add Appointment</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="apptTitle">Title / Description</label>
                        <input type="text" id="apptTitle" placeholder="e.g. Health Checkup" required>
                    </div>

                    <div class="form-group">
                        <label for="apptDate">Date</label>
                        <input type="date" id="apptDate" required>
                    </div>

                    <div class="form-group">
                        <label for="apptTime">Time</label>
                        <input type="time" id="apptTime" required>
                    </div>

                    <div class="form-group">
                        <label for="apptNotes">Notes (Optional)</label>
                        <textarea id="apptNotes" rows="2" placeholder="Details..."></textarea>
                    </div>

                    <button type="submit" id="saveBtn" class="btn">Save Appointment</button>
                </form>
            </div>

            <div class="card">
                <h2>Scheduled Appointments</h2>
                <div id="appointmentsList"></div>
            </div>
        </div>
    </div>

    <!-- Quick Selection Modal -->
    <div class="modal-overlay" id="quickModal">
        <div class="modal-box">
            <h2 style="color: var(--gold); margin-bottom: 10px;">Quick Selection</h2>
            
            <div class="quick-type-row" id="medFreqRow">
                <button type="button" class="btn" data-type="med-freq" style="margin-bottom: 5px;">Medication Frequency</button>
            </div>
            
            <div class="quick-type-row" id="generalRow">
                <button type="button" class="btn" data-type="general" style="margin-bottom: 5px;">General Routine</button>
            </div>

            <button type="button" class="btn btn-danger" id="closeModalBtn" style="margin-top: 15px; width: 100%;">Close</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('appointmentForm');
            var listContainer = document.getElementById('appointmentsList');
            var modal = document.getElementById('quickModal');
            var openModalBtn = document.getElementById('openModalBtn');
            var closeModalBtn = document.getElementById('closeModalBtn');

            // 1. Load saved appointments
            var appointments = [];
            try {
                var stored = localStorage.getItem('new_life_appointments');
                if (stored) {
                    appointments = JSON.parse(stored);
                }
            } catch(e) {
                console.error("Storage access error:", e);
            }

            renderAppointments();

            // 2. Form submission handler
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    var titleVal = document.getElementById('apptTitle').value;
                    var dateVal = document.getElementById('apptDate').value;
                    var timeVal = document.getElementById('apptTime').value;
                    var notesVal = document.getElementById('apptNotes').value;

                    var newAppt = {
                        id: Date.now(),
                        title: titleVal,
                        date: dateVal,
                        time: timeVal,
                        notes: notesVal
                    };

                    appointments.push(newAppt);
                    
                    appointments.sort(function(a, b) {
                        return new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time);
                    });

                    saveAndRender();
                    form.reset();
                });
            }

            // 3. Delete click handler
            if (listContainer) {
                listContainer.addEventListener('click', function(e) {
                    if (e.target && e.target.classList.contains('delete-btn')) {
                        var idToDelete = Number(e.target.getAttribute('data-id'));
                        appointments = appointments.filter(function(a) {
                            return a.id !== idToDelete;
                        });
                        saveAndRender();
                    }
                });
            }

            // 4. Modal Open Function (Line 832 Fixed)
            function openModal() {
                if (modal) modal.classList.add('active');

                // FIXED LINE 832: Replaced invalid [id!="medFreqRow"] with valid CSS :not(#medFreqRow)
                var quickButtons = document.querySelectorAll('.quick-type-row:not(#medFreqRow) [data-type]');
                
                quickButtons.forEach(function(btn) {
                    console.log("Found quick-type button:", btn.getAttribute('data-type'));
                });
            }

            if (openModalBtn) openModalBtn.addEventListener('click', openModal);
            if (closeModalBtn) closeModalBtn.addEventListener('click', function() {
                if (modal) modal.classList.remove('active');
            });

            function saveAndRender() {
                try {
                    localStorage.setItem('new_life_appointments', JSON.stringify(appointments));
                } catch(e) {
                    console.error("Could not save to localStorage:", e);
                }
                renderAppointments();
            }

            function renderAppointments() {
                if (!listContainer) return;
                listContainer.innerHTML = '';

                if (appointments.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">No upcoming appointments saved.</div>';
                    return;
                }

                appointments.forEach(function(appt) {
                    var item = document.createElement('div');
                    item.className = 'appointment-item';

                    var displayDate = appt.date + ' at ' + appt.time;
                    try {
                        displayDate = new Date(appt.date + 'T' + appt.time).toLocaleString([], {
                            weekday: 'short',
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    } catch(err) {}

                    item.innerHTML = 
                        '<div class="appt-info">' +
                            '<div class="appt-date">' + displayDate + '</div>' +
                            '<h3>' + escapeHtml(appt.title) + '</h3>' +
                            (appt.notes ? '<p>' + escapeHtml(appt.notes) + '</p>' : '') +
                        '</div>' +
                        '<button type="button" class="btn-danger delete-btn" data-id="' + appt.id + '">Delete</button>';

                    listContainer.appendChild(item);
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }
        });
    </script>
</body>
</html>
