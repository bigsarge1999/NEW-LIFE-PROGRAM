<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program & Appointment Calendar</title>
    <style>
        :root {
            --bg-main: #121413;
            --bg-panel: #1b1e1b;
            --bg-card: #242924;
            --accent-green: #2e5a36;
            --accent-hover: #3b7346;
            --text-light: #e1e4e1;
            --text-dim: #8c948c;
            --border-color: #2e352e;
            --gold: #c5a059;
            --danger: #a33b3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        header {
            border-bottom: 2px solid var(--accent-green);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media(min-width: 768px) {
            .main-grid {
                grid-template-columns: 320px 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--gold);
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            padding: 4px 8px;
            font-size: 0.8rem;
            width: auto;
        }

        .appointment-item {
            background-color: var(--bg-main);
            border-left: 4px solid var(--accent-green);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .appt-info h3 {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .appt-info p {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .appt-date {
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>APPOINTMENT CALENDAR</h1>
        </header>

        <div class="main-grid">
            <!-- APPOINTMENT ENTRY FORM -->
            <div class="card">
                <h2>Add Appointment</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="apptTitle">Title / Description</label>
                        <input type="text" id="apptTitle" placeholder="e.g. Equipment Inspection" required>
                    </div>

                    <div class="form-group">
                        <label for="apptDate">Date</label>
                        <input type="date" id="apptDate" required>
                    </div>

                    <div class="form-group">
                        <label for="apptTime">Time</label>
                        <input type="time" id="apptTime" required>
                    </div>

                    <div class="form-group">
                        <label for="apptNotes">Notes (Optional)</label>
                        <textarea id="apptNotes" rows="2" placeholder="Details or location..."></textarea>
                    </div>

                    <button type="submit" class="btn">Save Appointment</button>
                </form>
            </div>

            <!-- APPOINTMENTS LIST -->
            <div class="card">
                <h2>Scheduled Appointments</h2>
                <div id="appointmentsList">
                    <!-- Dynamic appointment items load here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('appointmentForm');
            const listContainer = document.getElementById('appointmentsList');

            // 1. Load saved appointments from local storage
            let appointments = JSON.parse(localStorage.getItem('my_appointments')) || [];

            // Render on startup
            renderAppointments();

            // 2. Handle form submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const newAppt = {
                    id: Date.now(),
                    title: document.getElementById('apptTitle').value,
                    date: document.getElementById('apptDate').value,
                    time: document.getElementById('apptTime').value,
                    notes: document.getElementById('apptNotes').value
                };

                appointments.push(newAppt);
                
                // Sort appointments by date & time
                appointments.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

                saveAndRender();
                form.reset();
            });

            // 3. Save to storage & update UI
            function saveAndRender() {
                localStorage.setItem('my_appointments', JSON.stringify(appointments));
                renderAppointments();
            }

            // 4. Draw appointment list dynamically
            function renderAppointments() {
                listContainer.innerHTML = '';

                if (appointments.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">No upcoming appointments saved.</div>';
                    return;
                }

                appointments.forEach((appt) => {
                    const item = document.createElement('div');
                    item.className = 'appointment-item';

                    // Format date to display nicely
                    const formattedDate = new Date(`${appt.date}T${appt.time}`).toLocaleString([], {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    item.innerHTML = `
                        <div class="appt-info">
                            <div class="appt-date">${formattedDate}</div>
                            <h3>${escapeHtml(appt.title)}</h3>
                            ${appt.notes ? `<p>${escapeHtml(appt.notes)}</p>` : ''}
                        </div>
                        <button class="btn btn-danger" onclick="deleteAppointment(${appt.id})">Delete</button>
                    `;

                    listContainer.appendChild(item);
                });
            }

            // 5. Delete handler
            window.deleteAppointment = function(id) {
                appointments = appointments.filter(a => a.id !== id);
                saveAndRender();
            };

            // Helper to prevent HTML injection
            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }
        });
    </script>
</body>
</html>
