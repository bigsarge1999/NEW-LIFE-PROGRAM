<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where We Eating?</title>
<style>
:root{--bg:#101310;--panel:#171b16;--line:#2a3126;--green:#4c8a55;--gb:#6bb873;--amber:#d9a441;--red:#c1594a;--text:#e9e7de;--dim:#9aa294;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 15% -10%,rgba(76,138,85,.08),transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;letter-spacing:.02em;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1.3fr 1fr auto;gap:12px;align-items:end}
@media(max-width:760px){.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input,select{width:100%;background:#0d100c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--gb)}
button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:var(--gb)}button:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.wheelbox{text-align:center;position:relative}
canvas{max-width:100%;height:auto}
.pointer{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--amber);z-index:2;filter:drop-shadow(0 2px 4px #000)}
#spin{margin-top:12px;font-size:18px;padding:14px 40px}
#status{color:var(--dim);font-size:13px;margin:10px 0;min-height:18px}
#status.err{color:var(--red)}
#winner{display:none;margin-top:14px;border:1px solid var(--amber);border-radius:10px;padding:14px;background:rgba(217,164,65,.08)}
#winner h2{color:var(--amber);font-size:22px}
#winner a{color:var(--gb);margin-right:14px;font-size:14px}
.list{max-height:520px;overflow:auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.item input{width:auto}.item .n{flex:1}.item .m{color:var(--dim);font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<h1>🍽️ Where We Eating?</h1>
<div class="sub">Enter a zip, pick a food type and range, then spin the wheel.</div>

<div class="panel">
<div class="form">
<div><label>Zip Code</label><input id="zip" inputmode="numeric" maxlength="5" placeholder="32569"></div>
<div><label>Food Type</label>
<select id="cuisine">
<option value="">Anything</option>
<option value="burger">Burgers</option>
<option value="pizza">Pizza</option>
<option value="mexican">Mexican</option>
<option value="chinese">Chinese</option>
<option value="japanese|sushi">Japanese / Sushi</option>
<option value="italian">Italian</option>
<option value="bbq|barbecue">BBQ</option>
<option value="seafood|fish">Seafood</option>
<option value="steak_house|steak">Steakhouse</option>
<option value="chicken">Chicken</option>
<option value="sandwich|sub">Sandwiches / Subs</option>
<option value="breakfast|brunch">Breakfast</option>
<option value="american">American</option>
<option value="thai|vietnamese|indian">Thai / Viet / Indian</option>
<option value="coffee_shop|ice_cream|dessert">Coffee / Dessert</option>
</select></div>
<div><label>Range</label>
<select id="range"><option>1</option><option>3</option><option selected>5</option><option>10</option><option>15</option><option>25</option><option>40</option></select></div>
<button id="go">Scan</button>
</div>
<div id="status"></div>
</div>

<div class="grid">
<div class="panel wheelbox">
<div class="pointer"></div>
<canvas id="wheel" width="460" height="460"></canvas><br>
<button id="spin" disabled>SPIN</button>
<div id="winner"></div>
</div>
<div class="panel">
<div class="head"><span>Places found</span><span id="count"></span></div>
<div class="list" id="list"><div class="item m">Nothing scanned yet.</div></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const COLORS=['#4c8a55','#d9a441','#c1594a','#3f7d8c','#7a5ea8','#a8683a','#6bb873','#8c8c3f','#b8517a','#4f6bb0','#5aa08a','#c47f2b'];
const MAX_SLICES=12;
let places=[],active=[],angle=0,spinning=false;
const cv=$('wheel'),ctx=cv.getContext('2d');

function setStatus(t,err){const s=$('status');s.textContent=t;s.className=err?'err':''}
function miles(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

async function geocode(zip){
  const r=await fetch('https://nominatim.openstreetmap.org/search?postalcode='+zip+'&country=us&format=json&limit=1');
  const j=await r.json();
  if(!j.length)throw new Error('Could not find that zip code.');
  return {lat:+j[0].lat,lon:+j[0].lon};
}
async function overpass(q){
  const urls=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  for(const u of urls){
    try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});
      if(r.ok)return await r.json();}catch(e){}
  }
  throw new Error('Search service is busy. Try again in a minute.');
}

async function scan(){
  const zip=$('zip').value.trim(),cu=$('cuisine').value,mi=+$('range').value;
  if(!/^\d{5}$/.test(zip))return setStatus('Enter a 5-digit zip code.',true);
  $('go').disabled=true;$('spin').disabled=true;$('winner').style.display='none';
  try{
    setStatus('Finding zip code…');
    const c=await geocode(zip);
    setStatus('Scanning for places within '+mi+' miles…');
    const rad=Math.round(mi*1609.34);
    let amen='restaurant|fast_food|cafe|ice_cream',filt='';
    if(cu){filt='["cuisine"~"'+cu+'",i]';if(/coffee|ice_cream/.test(cu))filt=''; if(/coffee/.test(cu))amen='cafe|ice_cream';}
    const q='[out:json][timeout:25];nwr["amenity"~"'+amen+'"]["name"]'+filt+'(around:'+rad+','+c.lat+','+c.lon+');out center tags 300;';
    const d=await overpass(q);
    const seen=new Set();places=[];
    for(const e of d.elements){
      const t=e.tags||{},la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;
      if(!t.name||la==null)continue;
      const key=t.name.toLowerCase()+Math.round(la*500)+Math.round(lo*500);
      if(seen.has(key))continue;seen.add(key);
      const addr=[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' ');
      places.push({name:t.name,cuisine:(t.cuisine||t.amenity||'').replace(/_/g,' ').replace(/;/g,', '),addr,lat:la,lon:lo,dist:miles(c.lat,c.lon,la,lo),on:true});
    }
    places.sort((a,b)=>a.dist-b.dist);
    if(!places.length){renderList();rebuild();return setStatus('No places found. Try a bigger range or "Anything".',true)}
    setStatus('Found '+places.length+' places. Hit SPIN!');
    renderList();rebuild();
  }catch(e){setStatus(e.message||'Something went wrong.',true)}
  $('go').disabled=false;
}

function renderList(){
  $('count').textContent=places.length?places.length+' total':'';
  $('list').innerHTML=places.length?'':'<div class="item m">No results.</div>';
  places.forEach((p,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<input type="checkbox" '+(p.on?'checked':'')+'><div class="n">'+esc(p.name)+'<div class="m">'+esc(p.cuisine||'')+(p.addr?' · '+esc(p.addr):'')+'</div></div><div class="m">'+p.dist.toFixed(1)+' mi</div>';
    d.querySelector('input').onchange=e=>{p.on=e.target.checked;rebuild()};
    $('list').appendChild(d);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function rebuild(){
  const pool=places.filter(p=>p.on);
  active=pool.sort(()=>Math.random()-.5).slice(0,MAX_SLICES);
  $('spin').disabled=active.length<2;
  draw();
}

function draw(){
  const W=cv.width,R=W/2-8,n=active.length;
  ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(W/2,W/2);
  if(!n){ctx.fillStyle='#1d2219';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.fillStyle='#9aa294';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('Scan to fill the wheel',0,6);ctx.restore();return}
  ctx.rotate(angle);
  const s=2*Math.PI/n;
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*s,(i+1)*s);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();ctx.strokeStyle='#101310';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate(i*s+s/2);ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font='bold '+(n>8?14:17)+'px system-ui';ctx.shadowColor='#000';ctx.shadowBlur=3;
    let t=active[i].name;if(t.length>20)t=t.slice(0,19)+'…';
    ctx.fillText(t,R-16,6);ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fillStyle='#101310';ctx.fill();ctx.strokeStyle='#d9a441';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}

function spin(){
  if(spinning||active.length<2)return;
  spinning=true;$('spin').disabled=true;$('winner').style.display='none';
  const n=active.length,s=2*Math.PI/n;
  const pick=Math.floor(Math.random()*n);
  // pointer is at top (-90deg). Slice center must land there.
  const target=(-Math.PI/2)-(pick*s+s/2)+(Math.random()-.5)*s*.7;
  const start=angle,spins=5+Math.floor(Math.random()*3);
  let end=target-Math.PI*2*spins;
  while(end>start)end-=Math.PI*2;
  const dur=5000,t0=performance.now();
  (function frame(now){
    const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    angle=start+(end-start)*e;draw();
    if(p<1)requestAnimationFrame(frame);
    else{spinning=false;$('spin').disabled=false;show(active[pick])}
  })(t0);
}

function show(p){
  const q=encodeURIComponent(p.name+(p.addr?' '+p.addr:'')+' '+$('zip').value);
  const dir='https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lon;
  const w=$('winner');w.style.display='block';
  w.innerHTML='<h2>🎉 '+esc(p.name)+'</h2><div class="m" style="margin:4px 0 10px;color:#9aa294">'+esc(p.cuisine||'')+(p.addr?' · '+esc(p.addr):'')+' · '+p.dist.toFixed(1)+' mi</div><a href="'+dir+'" target="_blank" rel="noopener">Directions</a><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">Reviews / Hours</a>';
}

$('go').onclick=scan;$('spin').onclick=spin;
$('zip').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
draw();
</script>
</body>
</html>
